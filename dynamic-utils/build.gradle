apply plugin: 'com.android.library'

android {
    compileSdkVersion versions.compileSdk
    buildToolsVersion versions.buildTools
    namespace 'com.pranavpandey.android.dynamic.util'

    defaultConfig {
        minSdkVersion versions.minSdk
        targetSdkVersion versions.targetSdk
    }

    sourceSets {
        main.res.srcDirs 'res'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation(platform("org.jetbrains.kotlin:kotlin-bom:${versions.kotlin}"))

    api "androidx.core:core:${versions.androidx}"
    api "androidx.print:print:${versions.print}"
}

if (project.rootProject.file("${publication}").exists()) {
    apply from: 'maven.gradle'
}

tasks.register('generateJavadoc') {
    description "Generates Javadoc."
}

androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    def variantName = variant.name.capitalize()
    def taskName = "generate${variantName}Javadoc"

    def javadocTask = tasks.register(taskName, Javadoc) {
        title "${referenceTitle}<h4>${versionDesc}</h4><h5>${mavenVersion}</h5>"
        description "Generates Javadoc for $variant.name."
        destinationDir = new File(destinationDir, variant.name)

        source = android.sourceSets.main.java.sourceFiles
        classpath = variant.compileClasspath + files(androidComponents.sdkComponents.bootClasspath)

        if (JavaVersion.current().isJava8Compatible()) {
            options.addStringOption('Xdoclint:none', '-quiet')
        }

        options.memberLevel = JavadocMemberLevel.PROTECTED
        exclude "**/R", "**/R.**", "**/R\$**", "**/BuildConfig*"

        options.windowTitle = "${referenceTitle}"
        options.links('https://docs.oracle.com/en/java/javase/17/docs/api')
        options.links('https://developer.android.com/reference')
        options.linksOffline('https://developer.android.com/reference',
                'https://developer.android.com/reference/androidx')

        failOnError false
    }

    javadocTask.configure {
        dependsOn "assemble${variantName}"
    }

    tasks.named('generateJavadoc').configure {
        dependsOn javadocTask
    }
}
